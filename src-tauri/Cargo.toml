[package]
name = "cliptrace-app"
version = "0.4.1"
edition = "2024"
default-run = "cliptrace-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
cliptrace-core = { path = "../crates/cliptrace-core", features = ["embeddings"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Serve the bundled UI from ui/dist instead of the Vite dev URL. Release builds need this.
custom-protocol = ["tauri/custom-protocol"]
