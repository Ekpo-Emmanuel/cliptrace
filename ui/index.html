<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cliptrace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ticket" role="dialog" aria-label="Clipboard search">
      <div class="perf" aria-hidden="true"></div>
      <header class="stub">
        <span class="brand">CLIPTRACE</span>
        <span id="stub-id" class="stub-id">—</span>
      </header>
      <label class="sr" for="q">Search clips</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="that stripe key from today" />
      <p id="note" class="note" hidden></p>
      <ul id="list" class="guest"></ul>
      <footer>
        <span>↑↓ move</span>
        <span>Enter paste</span>
        <span>Esc hide</span>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
